name: Build & Publish syspulse .deb to Nexus (APT)

on:
  push:
    branches: ["release"]
  workflow_dispatch:

env:
  GO_VERSION: "1.21"
  APT_DIST: stable
  APT_COMPONENT: main

jobs:
  build-publish-verify:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build static Linux binary
      run: |
        mkdir -p dist
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/syspulse .
        echo "Бинарник собран: $(ls -lh dist/syspulse)"

    - name: Prepare .deb structure
      id: pack
      run: |
        PKG=syspulse
        VER=$(awk -F\" '/const Version/ {print $2}' main.go)
        echo "Сборка пакета ${PKG} версии ${VER}"
        echo "pkg_ver=${VER}" >> $GITHUB_OUTPUT
        
        ROOT="build/${PKG}_${VER}"
        mkdir -p "${ROOT}/DEBIAN" "${ROOT}/usr/bin"
        cp dist/syspulse "${ROOT}/usr/bin/${PKG}"
        chmod 755 "${ROOT}/usr/bin/${PKG}"
        
        echo "Package: ${PKG}" > "${ROOT}/DEBIAN/control"
        echo "Version: ${VER}" >> "${ROOT}/DEBIAN/control"
        echo "Section: utils" >> "${ROOT}/DEBIAN/control"
        echo "Priority: optional" >> "${ROOT}/DEBIAN/control"
        echo "Architecture: amd64" >> "${ROOT}/DEBIAN/control"
        echo "Maintainer: DevOps Team <devops@example.com>" >> "${ROOT}/DEBIAN/control"
        echo "Description: Lightweight CLI tool for a system health snapshot" >> "${ROOT}/DEBIAN/control"
        echo "Depends: libc6 (>= 2.17)" >> "${ROOT}/DEBIAN/control"
        
        echo "deb_path=dist/${PKG}_${VER}_amd64.deb" >> $GITHUB_OUTPUT

    - name: Build .deb inside Docker
      run: |
        docker run --rm -v "$PWD:/app" -w /app ubuntu:22.04 bash -c "dpkg-deb --build --root-owner-group build/syspulse_${{ steps.pack.outputs.pkg_ver }} dist/syspulse_${{ steps.pack.outputs.pkg_ver }}_amd64.deb"

    - name: Upload .deb to Nexus via Python REST API
      run: |
        DEB_FILE="${{ steps.pack.outputs.deb_path }}"
        
        cat > upload.py << 'PYEOF'
        import requests
        import sys
        
        url = f"http://{sys.argv[1]}:8081/service/rest/v1/components?repository=syspulse"
        user = sys.argv[2]
        password = sys.argv[3]
        file_path = sys.argv[4]
        
        files = {
            'apt.asset': (file_path.split('/')[-1], open(file_path, 'rb'), 'application/vnd.debian.binary-package')
        }
        
        data = {
            'apt.directory': 'pool/main/s/syspulse',
            'apt.distribution': 'stable',
            'apt.component': 'main'
        }
        
        response = requests.post(url, auth=(user, password), files=files, data=data)
        print(f"Status Code: {response.status_code}")
        print(f"Response: {response.text}")
        if response.status_code not in [200, 201, 204]:
            sys.exit(1)
        PYEOF
        
        docker run --rm -v "$PWD:/work" -w /work python:3.10-slim bash -c "
          pip install requests -q
          python upload.py ${{ secrets.NEXUS_HOST }} ${{ secrets.NEXUS_USER }} ${{ secrets.NEXUS_PASSWORD }} ${DEB_FILE}
        "
        echo "Пакет успешно загружен в Nexus!"

    - name: Verify install via apt in Ubuntu container
      run: |
        docker run --rm ubuntu:22.04 bash -c "
          set -e
          apt-get update -y
          apt-get install -y --no-install-recommends ca-certificates curl
          echo 'deb [trusted=yes] http://${{ secrets.NEXUS_HOST }}:8081/repository/syspulse/ ${{ env.APT_DIST }} ${{ env.APT_COMPONENT }}' > /etc/apt/sources.list.d/syspulse.list
          apt-get update
          apt-get install -y syspulse
          echo '--- package info ---'
          dpkg -s syspulse | grep -E '^(Package|Version|Architecture)'
          echo '--- run app ---'
          syspulse --version
          syspulse
        "
        echo "Верификация пройдена!"

    - name: Save .deb as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: syspulse-deb
        path: dist/*.deb
        retention-days: 7
